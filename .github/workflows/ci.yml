# Build + full test suite on every pull request and on every push to main.
#
# Separate from publish.yml deliberately: publishing is gated on release tags.
# This workflow never publishes anything.
#
# A branch is tested by its pull request, not by its pushes as well: with both
# triggers every commit of an open pull request ran twice. A branch with no pull
# request yet is run by hand (workflow_dispatch).
#
# The jobs run side by side, each on a runner of its own: one builds every
# target, and the test jobs each build one framework alone and run a share of
# its tests - three shares on .NET Framework, whose tests take 10 to 12 minutes
# one after another, and all of them in one job on .NET, where they take about
# five (scripts/Invoke-TestShard.ps1). They run on Windows, but for one that
# runs the .NET 10 tests on Linux (#122).
#
# The Access referee tests (tests/JackcessDotNet.AccessTests) need Microsoft
# Access's own engine, which hosted runners lack: access-build builds them once,
# and the access-tests jobs install the Access Database Engine 2016
# redistributable and run them in shards (scripts/Invoke-AccessTests.ps1). Those
# whose sweeps take minutes run a sample of them on a pull request, and the
# whole sweeps on a push to main, every night, and in a run by hand that asks.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every night at 16:17 UTC, on main: the Access referee tests' full sweeps.
    - cron: '17 16 * * *'
  workflow_dispatch:
    inputs:
      full_sweeps:
        description: 'Run the Access referee tests full sweeps rather than the samples a pull request runs'
        type: boolean
        default: true

env:
  # 1 runs the Access referee tests' full sweeps and 0 their samples
  # (tests/JackcessDotNet.AccessTests/Support/Sweeps.cs): the samples on a pull
  # request and in a run by hand that does not ask for the sweeps.
  JACKCESS_FULL_SWEEPS: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_sweeps)) && '1' || '0' }}

# A newer run of the same pull request or branch cancels the older one. Not on
# main: every run there has a group of its own and runs to the end, so each
# commit of main has a result.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # Every target at once, as a release builds them: a break in one (missing BCL
  # surface, see Util/FrameworkCompat.cs), a warning the project makes an error
  # (the public API files, XML documentation) and the package the build writes.
  build:
    name: build (every target)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # 11.0.x builds everything: the library targets net11.0, and an SDK older
      # than a project's newest target cannot restore it, so global.json asks
      # for 11.0.100 or later. It also reads the .slnx, as every SDK from
      # 9.0.2xx does. 10.0.x for the net10.0 target's reference assemblies.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # The packages a restore would download, kept from the last run whose
      # project files were these.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-build-${{ hashFiles('**/*.csproj', 'global.json') }}

      # Hash every fixture against tests/corpus/MANIFEST.sha256. A missing,
      # truncated, edited or newline-mangled .mdb otherwise surfaces as a
      # baffling parser failure a long way from the cause; this turns it into
      # one line naming the file. Here and not in each test job: every job
      # checks out the same commit, so one check covers them all.
      - name: Verify test corpus
        shell: pwsh
        run: ./tools/corpus.ps1

      # Record WHAT was tested against, so a build log is self-contained
      # evidence months from now without re-deriving it from the commit.
      - name: Record corpus provenance
        shell: pwsh
        run: |
          $m = Get-FileHash tests/corpus/MANIFEST.sha256 -Algorithm SHA256
          $n = (Get-ChildItem tests/corpus -Recurse -File -Include *.mdb,*.accdb).Count
          "### Test corpus`n"                                   >> $env:GITHUB_STEP_SUMMARY
          "- fixtures: **$n**"                                  >> $env:GITHUB_STEP_SUMMARY
          "- manifest sha256: ``$($m.Hash.ToLower())``"         >> $env:GITHUB_STEP_SUMMARY
          "- commit: ``$env:GITHUB_SHA``"                       >> $env:GITHUB_STEP_SUMMARY

      - name: Restore
        run: dotnet restore JackcessDotNet.slnx

      - name: Build (net10.0 + net11.0 + net48 + netstandard2.0)
        run: dotnet build JackcessDotNet.slnx --configuration Release --no-restore

      # The build writes the package (GeneratePackageOnBuild). What it says each
      # target depends on is what an application on that target restores, so it
      # is stated here and a change to it fails: .NET 10 and 11 need no package,
      # and the netstandard2.0 assembly - the one .NET 8 and 9 and .NET
      # Framework 4.7.2 get - needs all four of these.
      - name: Check the package's dependencies
        shell: pwsh
        run: |
          $expected = [ordered]@{
            'net10.0'          = ''
            'net11.0'          = ''
            '.NETFramework4.8' = 'Microsoft.Bcl.HashCode 6.0.0, System.Memory 4.6.0'
            '.NETStandard2.0'  = 'Microsoft.Bcl.HashCode 6.0.0, System.ComponentModel.Annotations 5.0.0, System.Memory 4.6.0, System.Text.Encoding.CodePages 8.0.0'
          }
          $nupkg = @(Get-ChildItem artifacts/*.nupkg)
          if ($nupkg.Count -ne 1) { throw "Expected one .nupkg in artifacts/, found $($nupkg.Count)" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($nupkg[0].FullName)
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -like '*.nuspec' }
            $reader = New-Object IO.StreamReader($entry.Open())
            $nuspec = [xml]$reader.ReadToEnd()
            $reader.Dispose()
            $libs = @($zip.Entries | Where-Object { $_.FullName -like 'lib/*/JackcessDotNet.dll' } | ForEach-Object { $_.FullName.Split('/')[1] } | Sort-Object)
          } finally { $zip.Dispose() }
          "lib: $($libs -join ', ')"
          if (($libs -join ', ') -ne 'net10.0, net11.0, net48, netstandard2.0') { throw "The package's lib folders are $($libs -join ', ')" }
          $groups = @($nuspec.package.metadata.dependencies.group)
          if ($groups.Count -ne $expected.Count) { throw "The package has $($groups.Count) dependency groups, expected $($expected.Count)" }
          foreach ($group in $groups) {
            $target = $group.targetFramework
            $has = (@($group.dependency | Where-Object { $_ } | ForEach-Object { "$($_.id) $($_.version)" } | Sort-Object) -join ', ')
            "${target}: $(if ($has) { $has } else { 'no package' })"
            if (-not $expected.Contains($target)) { throw "The package has a dependency group for $target" }
            if ($has -ne $expected[$target]) { throw "${target} depends on [$has], expected [$($expected[$target])]" }
          }

  # The whole suite on one framework, corpus tests included (no --filter): they
  # are the only thing that checks this parser against files real Access wrote.
  # A job builds its own framework rather than download what the build job
  # built: building one framework takes less time than an artifact's round
  # trip, and no job waits for another.
  #
  # net48 is the only test of the library itself on .NET Framework: its
  # assembly has code of its own (Util/FrameworkCompat.cs) and the framework's
  # own text encodings, hashing, parsing and formatting.
  #
  # netstandard2.0, the library's fourth target, has no runtime of its own, so
  # no test project can target it. NetStandardAsset has the test project
  # reference that assembly whatever its own framework: on net10.0 it is loaded
  # as an application on .NET 8 or 9 loads it, and on net48 as one on .NET
  # Framework 4.7.2 does.
  #
  # net48, 32-bit is the net48 tests in a 32-bit process (-p:TestX86=true): .NET Framework computes doubles there
  # with the x87 unit, whose precision another component in the process can change - ACE leaves it at 64 bits - and
  # a computation that ended in a 64-bit process did not end there (#98).
  #
  # Each framework's test classes are split between its shards: every shard
  # lists the same tests and splits them alike, balanced by how long each class
  # took on CI, so the shards of a framework run every class once between them,
  # and each fails unless it ran every test of its own classes.
  frameworks:
    name: test (${{ matrix.name }}, ${{ matrix.shard }} of ${{ matrix.shards }})
    runs-on: windows-latest
    strategy:
      # Every shard runs to the end, so one run reports every failure.
      fail-fast: false
      # A job spends about a minute besides its tests: setup, checkout, the build and the listing. One job to a .NET
      # configuration, whose tests take 3.5 to 6 minutes on a runner, and three to a .NET Framework one, whose
      # shards take 3 to 5: each job takes about as long as access-build and the longest Access shard, 6 to 7
      # minutes, or less, and a run has as few jobs as that allows. Two to a .NET Framework configuration would take
      # 6 to 7.5 minutes each.
      matrix:
        include:
          - { name: net10.0, id: net10.0, framework: net10.0, sdks: "10.0.x\n11.0.x", shard: 1, shards: 1 }
          - { name: net11.0, id: net11.0, framework: net11.0, sdks: 11.0.x, shard: 1, shards: 1 }
          - { name: net48, id: net48, framework: net48, sdks: 11.0.x, shard: 1, shards: 3 }
          - { name: net48, id: net48, framework: net48, sdks: 11.0.x, shard: 2, shards: 3 }
          - { name: net48, id: net48, framework: net48, sdks: 11.0.x, shard: 3, shards: 3 }
          - { name: "net48, 32-bit", id: net48-x86, framework: net48, properties: -p:TestX86=true, sdks: 11.0.x, shard: 1, shards: 3 }
          - { name: "net48, 32-bit", id: net48-x86, framework: net48, properties: -p:TestX86=true, sdks: 11.0.x, shard: 2, shards: 3 }
          - { name: "net48, 32-bit", id: net48-x86, framework: net48, properties: -p:TestX86=true, sdks: 11.0.x, shard: 3, shards: 3 }
          - { name: netstandard2.0 on net10.0, id: netstandard2.0-net10.0, framework: net10.0, properties: -p:NetStandardAsset=true, sdks: "10.0.x\n11.0.x", shard: 1, shards: 1 }
          - { name: netstandard2.0 on net48, id: netstandard2.0-net48, framework: net48, properties: -p:NetStandardAsset=true, sdks: 11.0.x, shard: 1, shards: 3 }
          - { name: netstandard2.0 on net48, id: netstandard2.0-net48, framework: net48, properties: -p:NetStandardAsset=true, sdks: 11.0.x, shard: 2, shards: 3 }
          - { name: netstandard2.0 on net48, id: netstandard2.0-net48, framework: net48, properties: -p:NetStandardAsset=true, sdks: 11.0.x, shard: 3, shards: 3 }
    steps:
      - uses: actions/checkout@v7

      # 11.0.x builds and runs the tests on Microsoft Testing Platform
      # (global.json), as every SDK from 10 does. 10.0.x where the tests run on
      # its runtime. .NET Framework 4.8 is part of the runner.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdks }}

      # As in the build job. A cache to a framework, shared by its shards: the
      # netstandard2.0 jobs restore packages the others do not.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.id }}-${{ hashFiles('**/*.csproj', 'global.json') }}

      # The test project for this framework, and of the library only the
      # assembly it references.
      - name: Build
        run: dotnet build tests/JackcessDotNet.Tests --configuration Release --framework ${{ matrix.framework }} ${{ matrix.properties }}

      # This shard's classes, in one process. A report to a job, named for it,
      # since every job would write the same name. On a pull request a test
      # class with no row in the script's timing table fails the job, after its
      # tests have run, with an error that says what to add.
      - name: Test
        shell: pwsh
        run: ./scripts/Invoke-TestShard.ps1 -Framework ${{ matrix.framework }} -Shard ${{ matrix.shard }} -Shards ${{ matrix.shards }} -Properties '${{ matrix.properties }}' -TrxName test-results-${{ matrix.id }}-${{ matrix.shard }}.trx ${{ github.event_name == 'pull_request' && '-RequireTimings' || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.id }}-${{ matrix.shard }}
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  # The tests on Linux, where the library runs as well (#122): .NET 10. What
  # differs there is how a file is shared: .NET keeps to a handle's sharing by
  # advisory locks, so a test of a writer kept out skips, saying why, and
  # FileSharingTests and KeepWritersOutTests pin what Linux does instead
  # (docs/sharing.md). The netstandard2.0 assembly on .NET 10 as well, one after
  # the other, took 8m40s, longer than any other job; alone the tests take
  # under four minutes. That assembly runs on .NET 10 on Windows, above. It
  # does not ask for -RequireTimings: the Windows jobs check every class's row,
  # and Linux's times are not the net10.0 column's.
  linux:
    name: test (net10.0, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Why these SDKs: the build job's.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.csproj', 'global.json') }}

      - name: Build
        run: dotnet build tests/JackcessDotNet.Tests --configuration Release --framework net10.0

      - name: Test
        shell: pwsh
        run: ./scripts/Invoke-TestShard.ps1 -Framework net10.0 -TrxName test-results-linux-net10.0.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  # The Access referee tests, built once - net48, x64 - and handed to the
  # access-tests jobs, which run them without building or a .NET SDK. The
  # project's corpus and assets are read where this checkout had them, the same
  # path on every runner.
  access-build:
    name: build (Access referee tests)
    runs-on: windows-latest
    env:
      # Whether this run has the 32-bit Access shards: as access-tests' matrix says.
      X86: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:access-x86')) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Why these SDKs: the build job's.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-access-${{ hashFiles('**/*.csproj', 'global.json') }}

      # The library's net48 assembly and the tests; nothing is packed here.
      - name: Build
        run: >
          dotnet build tests/JackcessDotNet.AccessTests --configuration Release
          -p:GeneratePackageOnBuild=false -p:ContinuousIntegrationBuild=true

      # The same, as a 32-bit program (bin/Release-x86), for the 32-bit shards.
      - name: Build (32-bit)
        if: env.X86 == 'true'
        run: >
          dotnet build tests/JackcessDotNet.AccessTests --configuration Release -p:TestX86=true
          -p:GeneratePackageOnBuild=false -p:ContinuousIntegrationBuild=true

      - name: Upload the tests
        uses: actions/upload-artifact@v7
        with:
          name: access-tests
          path: tests/JackcessDotNet.AccessTests/bin/Release/net48
          retention-days: 1
          if-no-files-found: error

      - name: Upload the tests (32-bit)
        if: env.X86 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: access-tests-x86
          path: tests/JackcessDotNet.AccessTests/bin/Release-x86/net48
          retention-days: 1
          if-no-files-found: error

  # Microsoft Access's engine as the referee: ACE through OLE DB, and DAO, from
  # the Access Database Engine 2016 redistributable (x64). scripts/Invoke-AccessTests.ps1
  # runs a class to a process, or a piece of one for the few that take minutes,
  # two processes at a time, each on a processor of its own; ends a process that
  # hangs; balances the pieces between the shards by the
  # seconds each took on CI; runs again a process that died inside the
  # redistributable, and a piece whose only failures are ACE statements that
  # failed with no message of their own; and checks that each shard ran every
  # test of its own pieces. JACKCESS_ACCESS_REQUIRED makes a missing referee a
  # failure here, where on a machine without Access the tests are skipped.
  #
  # The x86 shards run the same tests as a 32-bit program, against the
  # redistributable's x86 installer - 32-bit ACE 16 and DAO 16 - on runners of
  # their own (#101). A 32-bit process is where .NET Framework computes doubles
  # with the x87 unit, whose precision ACE changes (#98), and where Access's own
  # 32-bit engine answers. They take two more jobs of about seven minutes, so
  # they run on a push to main, every night and in a run by hand, and on a pull
  # request only when it has the ci:access-x86 label - a change to the 32-bit
  # path itself - read when the run starts: label it, then push (or close and
  # reopen it). They run the samples whatever the event: the full sweeps, over
  # an hour of processes in 64 bits, are the 64-bit shards', and some pieces
  # take three times as long in 32 bits.
  access-tests:
    name: test (Access${{ matrix.arch == 'x86' && ', 32-bit' || '' }}, ${{ matrix.shard }} of ${{ matrix.shards }})
    needs: access-build
    runs-on: windows-latest
    # A shard takes some five minutes with the samples and nine with the full sweeps; a process that hangs is
    # ended by the script, so this only bounds what the script cannot.
    timeout-minutes: 45
    strategy:
      # Every shard runs to the end, so one run reports every failure.
      fail-fast: false
      # Four: with the samples, access-build and the longest of four shards take about as long as the longest
      # framework job, a .NET configuration's one, so more shards would not shorten a pull request's run, and each
      # would take a runner from the account's limit of jobs at once. Each shard also pays about 25 s of checkout,
      # download and install. Two in 32 bits, three processes at a time: their tests take some 38 minutes of
      # processes (run 44877333525), about seven minutes a shard, as long as the longest framework job.
      #
      # The 32-bit shards only where X86 (below) says: the four 64-bit ones, and the two 32-bit ones after them.
      matrix:
        include: >-
          ${{ fromJSON(format('[{0}{1}]',
          '{"arch":"x64","shard":1,"shards":4,"parallel":2},{"arch":"x64","shard":2,"shards":4,"parallel":2},{"arch":"x64","shard":3,"shards":4,"parallel":2},{"arch":"x64","shard":4,"shards":4,"parallel":2}',
          (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:access-x86'))
          && ',{"arch":"x86","shard":1,"shards":2,"parallel":3},{"arch":"x86","shard":2,"shards":2,"parallel":3}' || '')) }}
    env:
      JACKCESS_ACCESS_REQUIRED: '1'
    steps:
      # Installed silently; /quiet also bypasses the bitness cross-check against
      # any preinstalled Office components. It is started first, in a process of
      # its own, and waited for before the tests: it takes about as long as the
      # checkout and the download, and neither needs the other.
      #
      # A download can be cut off by the remote host, so it is tried up to four
      # times, 15 s apart, and the installer is run only when it is whole: as
      # long as the server said, and signed by Microsoft, which a file cut short
      # or changed in transit is not. The signature is checked, not a pinned
      # hash: Microsoft publishes a new file at the same address from time to
      # time, and a pinned hash would fail every run from then on. Each shard
      # downloads its own: the download takes seconds and overlaps the checkout,
      # where handing 83 MB on from access-build would lengthen that job and
      # start the install only after an artifact's download.
      - name: Install Access Database Engine 2016 (${{ matrix.arch }}), in the background
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'install-ace.ps1'
          Set-Content -LiteralPath $script -Value @'
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'ace-install.log'
          try {
            $name = '${{ matrix.arch == 'x86' && 'accessdatabaseengine.exe' || 'accessdatabaseengine_X64.exe' }}'
            $url = "https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/$name"
            $exe = Join-Path $env:RUNNER_TEMP $name
            $attempts = 4
            for ($attempt = 1; ; $attempt++) {
              try {
                Remove-Item -LiteralPath $exe -ErrorAction SilentlyContinue
                # A connection that stalls fails, and is tried again, rather than hold the job to its timeout.
                $response = Invoke-WebRequest -Uri $url -OutFile $exe -PassThru -ConnectionTimeoutSeconds 30 -OperationTimeoutSeconds 60
                $length = (Get-Item -LiteralPath $exe).Length
                $sent = @($response.Headers['Content-Length'])[0]
                if ($sent -and [long]$sent -ne $length) { throw "the file is $length bytes, where the server said $sent" }
                $signature = Get-AuthenticodeSignature -LiteralPath $exe
                if ($signature.Status -ne 'Valid') { throw "the file's signature is $($signature.Status): $($signature.StatusMessage)" }
                if ($signature.SignerCertificate.Subject -notmatch '(^|, )O=Microsoft Corporation(,|$)') { throw "the file is signed by $($signature.SignerCertificate.Subject)" }
                "Downloaded the installer, $length bytes signed by Microsoft, at attempt $attempt." | Add-Content -LiteralPath $log
                break
              } catch {
                $why = "attempt $attempt of ${attempts}: $($_.Exception.Message.TrimEnd('.'))"
                if ($attempt -ge $attempts) {
                  "The download failed, $why. The installer was not run." | Add-Content -LiteralPath $log
                  Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'ace-download.failed') -Value $why
                  return
                }
                "The download failed, $why. Trying again in 15 s." | Add-Content -LiteralPath $log
                Start-Sleep -Seconds 15
              }
            }
            $installer = Start-Process -FilePath $exe -ArgumentList '/quiet' -Wait -PassThru
            "The installer ended with exit code $($installer.ExitCode)." | Add-Content -LiteralPath $log
          } catch {
            "The installation failed: $_" | Add-Content -LiteralPath $log
          } finally {
            New-Item -ItemType File -Force (Join-Path $env:RUNNER_TEMP 'ace-install.done') | Out-Null
          }
          '@
          $process = Start-Process pwsh -ArgumentList '-NoProfile', '-NonInteractive', '-File', $script -WindowStyle Hidden -PassThru
          "ACE_INSTALL_PID=$($process.Id)" >> $env:GITHUB_ENV
          "Started the installer's process, $($process.Id)."

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the tests
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.arch == 'x86' && 'access-tests-x86' || 'access-tests' }}
          path: tests/JackcessDotNet.AccessTests/bin/${{ matrix.arch == 'x86' && 'Release-x86' || 'Release' }}/net48

      # The redistributable has killed a test process with exit code
      # -1073740771 and no test named; a dump showed the crash inside it, on a
      # thread of its own. Windows keeps a dump of any process that crashes from
      # here on, uploaded below.
      - name: Keep a dump of any process that crashes
        shell: pwsh
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP 'crash-dumps'
          New-Item -ItemType Directory -Force $dumps | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name DumpFolder -Value $dumps -Type ExpandString
          Set-ItemProperty -Path $key -Name DumpType -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name DumpCount -Value 5 -Type DWord

      # The installer started above, finished and registered. Should its
      # process have gone without finishing, it is run here instead. A download
      # that failed every attempt fails here, saying so, before ACE is asked.
      - name: Access Database Engine 2016 (${{ matrix.arch }}) installed
        shell: pwsh
        run: |
          $done = Join-Path $env:RUNNER_TEMP 'ace-install.done'
          $clock = [Diagnostics.Stopwatch]::StartNew()
          while (-not (Test-Path -LiteralPath $done) -and (Get-Process -Id $env:ACE_INSTALL_PID -ErrorAction SilentlyContinue)) {
            if ($clock.Elapsed.TotalMinutes -gt 10) { throw 'The Access Database Engine installer has not finished in ten minutes.' }
            Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path -LiteralPath $done)) {
            '::warning::The installer process ended without finishing; installing now.'
            & pwsh -NoProfile -NonInteractive -File (Join-Path $env:RUNNER_TEMP 'install-ace.ps1')
          }
          Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'ace-install.log')
          "Waited $([math]::Round($clock.Elapsed.TotalSeconds)) s for it."
          $failed = Join-Path $env:RUNNER_TEMP 'ace-download.failed'
          if (Test-Path -LiteralPath $failed) {
            throw "The download of the Access Database Engine installer failed, $((Get-Content -LiteralPath $failed -Raw).Trim()). Nothing was installed; running the job again may get it."
          }
          "Processors: $([Environment]::ProcessorCount)"
          # ACE's first use on the machine, in one process of the tests' bitness before the tests start theirs side
          # by side: Windows PowerShell's 32-bit one for the x86 engine. Asked for a file that is not there, the
          # provider loads and answers; one that is not registered fails here. Its version is the file version of
          # the DLL the provider is registered with.
          $probe = Join-Path $env:RUNNER_TEMP 'probe-ace.ps1'
          Set-Content -LiteralPath $probe -Value @'
          $ErrorActionPreference = 'Stop'
          "Process: $(if ([Environment]::Is64BitProcess) { '64' } else { '32' })-bit"
          $clsid = (Get-ItemProperty 'Registry::HKEY_CLASSES_ROOT\Microsoft.ACE.OLEDB.12.0\CLSID').'(default)'
          $dll = (Get-ItemProperty "Registry::HKEY_CLASSES_ROOT\CLSID\$clsid\InprocServer32").'(default)'
          "Microsoft.ACE.OLEDB.12.0: $dll, $((Get-Item -LiteralPath $dll).VersionInfo.FileVersion)"
          $conn = New-Object System.Data.OleDb.OleDbConnection "Provider=Microsoft.ACE.OLEDB.12.0;Data Source=$env:RUNNER_TEMP\probe.mdb"
          try { $conn.Open() } catch { if ($_.Exception.Message -match 'not registered') { throw 'The ACE provider is not registered after the install.' } "ACE answered: $($_.Exception.Message)" }
          finally { $conn.Dispose() }
          '@
          $shell = if ('${{ matrix.arch }}' -eq 'x86') { "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" } else { 'pwsh' }
          & $shell -NoProfile -NonInteractive -File $probe
          if ($LASTEXITCODE) { throw "The probe of ACE failed (exit $LASTEXITCODE)." }

      # On a pull request a piece with no time in the script's tables fails the
      # job, after its tests have run, with an error that says what to add.
      - name: Test
        shell: pwsh
        env:
          JACKCESS_FULL_SWEEPS: ${{ matrix.arch == 'x86' && '0' || env.JACKCESS_FULL_SWEEPS }}
        run: |
          ./scripts/Invoke-AccessTests.ps1 -Shard ${{ matrix.shard }} -Shards ${{ matrix.shards }} -Parallel ${{ matrix.parallel }} -ProcessorsEach 1 -TrxName "access-tests-${{ matrix.arch == 'x86' && 'x86-' || '' }}${{ matrix.shard }}.trx" ${{ matrix.arch == 'x86' && '-X86' || '' }} ${{ github.event_name == 'pull_request' && '-RequireTimings' || '' }}
          exit $LASTEXITCODE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-access-${{ matrix.arch == 'x86' && 'x86-' || '' }}${{ matrix.shard }}
          path: |
            TestResults/*.trx
            TestResults/*.xml
          if-no-files-found: warn

      - name: Upload crash dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crash-dumps-access-${{ matrix.arch == 'x86' && 'x86-' || '' }}${{ matrix.shard }}
          path: ${{ runner.temp }}/crash-dumps/*.dmp
          if-no-files-found: ignore

  # One check with the name this workflow's only job had, for anything that
  # waits on "test": it passes when the build, every framework, Linux and the
  # Access referee tests did.
  test:
    name: test
    if: always()
    needs: [build, frameworks, linux, access-build, access-tests]
    runs-on: ubuntu-latest
    steps:
      - name: The build, every framework, Linux and the Access referee tests passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then exit 1; fi
          done
