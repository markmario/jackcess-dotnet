# Build + full test suite on every push and every pull request, on every branch.
#
# Separate from publish.yml deliberately: publishing is gated on release tags,
# but a feature branch needs to know it is green BEFORE it opens a PR. This
# workflow never publishes anything.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # 11.0.x builds everything: the library targets net11.0, and an SDK older
      # than a project's newest target cannot restore it, so global.json asks
      # for 11.0.100 or later. It also runs the tests on Microsoft Testing
      # Platform (global.json), as every SDK from 10 does, and reads the .slnx,
      # as every SDK from 9.0.2xx does.
      # 10.0.x for its runtime: the tests run on net10.0 as well as net11.0.
      # .NET Framework 4.8, the tests' third framework, is part of the runner.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # Hash every fixture against tests/corpus/MANIFEST.sha256 BEFORE building.
      # A missing, truncated, edited or newline-mangled .mdb otherwise surfaces
      # as a baffling parser failure a long way from the cause; this turns it
      # into one line naming the file. Runs first so it costs 2s to rule out.
      - name: Verify test corpus
        shell: pwsh
        run: ./tools/corpus.ps1

      # Record WHAT was tested against, so a build log is self-contained
      # evidence months from now without re-deriving it from the commit.
      - name: Record corpus provenance
        shell: pwsh
        run: |
          $m = Get-FileHash tests/corpus/MANIFEST.sha256 -Algorithm SHA256
          $n = (Get-ChildItem tests/corpus -Recurse -File -Include *.mdb,*.accdb).Count
          "### Test corpus`n"                                   >> $env:GITHUB_STEP_SUMMARY
          "- fixtures: **$n**"                                  >> $env:GITHUB_STEP_SUMMARY
          "- manifest sha256: ``$($m.Hash.ToLower())``"         >> $env:GITHUB_STEP_SUMMARY
          "- commit: ``$env:GITHUB_SHA``"                       >> $env:GITHUB_STEP_SUMMARY

      - name: Restore
        run: dotnet restore JackcessDotNet.slnx

      # The library multi-targets net10.0, net11.0, net48 and netstandard2.0;
      # build them all so a break in one (missing BCL surface, see
      # Util/FrameworkCompat.cs) fails here and not in a downstream consumer.
      - name: Build (net10.0 + net11.0 + net48 + netstandard2.0)
        run: dotnet build JackcessDotNet.slnx --configuration Release --no-restore

      # No --filter. The whole suite runs, corpus tests included: they are the
      # only thing that checks this parser against files real Access wrote.
      # One framework to a step: run together they write the same report file
      # name, and a step of its own says which framework failed.
      - name: Test (net10.0)
        run: dotnet test --project tests/JackcessDotNet.Tests --configuration Release --no-build --framework net10.0 --report-xunit-trx --report-xunit-trx-filename test-results-net10.0.trx

      - name: Test (net11.0)
        run: dotnet test --project tests/JackcessDotNet.Tests --configuration Release --no-build --framework net11.0 --report-xunit-trx --report-xunit-trx-filename test-results-net11.0.trx

      # The only test of the library itself on .NET Framework: its net48
      # assembly has code of its own (Util/FrameworkCompat.cs) and the
      # framework's own text encodings, hashing, parsing and formatting.
      - name: Test (net48)
        run: dotnet test --project tests/JackcessDotNet.Tests --configuration Release --no-build --framework net48 --report-xunit-trx --report-xunit-trx-filename test-results-net48.trx

      # The fourth target has no runtime of its own, so no test project can
      # target it. NetStandardAsset has the test project reference the
      # netstandard2.0 assembly whatever its own framework: on net10.0 it is
      # loaded as an application on .NET 8 or 9 loads it, and on net48 as one
      # on .NET Framework 4.7.2 does. A build of its own (bin/Release-netstandard),
      # after the tests above: it restores the test project again, with the
      # packages that assembly needs.
      - name: Build (the tests against the netstandard2.0 assembly)
        run: dotnet build tests/JackcessDotNet.Tests --configuration Release -p:NetStandardAsset=true

      - name: Test (netstandard2.0 on net10.0)
        run: dotnet test --project tests/JackcessDotNet.Tests --configuration Release --no-build --framework net10.0 -p:NetStandardAsset=true --report-xunit-trx --report-xunit-trx-filename test-results-netstandard2.0-net10.0.trx

      - name: Test (netstandard2.0 on net48)
        run: dotnet test --project tests/JackcessDotNet.Tests --configuration Release --no-build --framework net48 -p:NetStandardAsset=true --report-xunit-trx --report-xunit-trx-filename test-results-netstandard2.0-net48.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
