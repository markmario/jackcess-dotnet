name: Retired publish workflow (keep disabled)

# Kept on purpose, with nothing to run, and DISABLED in the repository's Actions settings. Never enable it,
# never delete it, and never put a workflow back at this path.
#
# GitHub runs a tag's workflow from the commit the tag points at. Every commit before this file was retired carries
# upstream's release job here: on any v* tag it built that commit and pushed it to nuget.org with no check of the tag
# at all. A tag on one of those commits would publish whatever it builds. Disabling the workflow at this path stops it
# on every commit at once, old ones included, so a tag on an old commit runs nothing. Releases now run from
# publish.yml, which checks the tag first, and which fails while this one is enabled (its retired-workflow job).
#
# Disable it by file name:
#   gh workflow disable nuget-publish.yml --repo markmario/jackcess-dotnet
#   gh api repos/markmario/jackcess-dotnet/actions/workflows/nuget-publish.yml --jq .state    -> disabled_manually

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Retired
        run: |
          echo "This workflow is retired: releases run from .github/workflows/publish.yml."
          exit 1
